name: Public release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      standalone_tag:
        description: Existing standalone tag to build, attest, and backfill
        required: true
        type: string

concurrency:
  group: public-release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package artifacts
        run: pnpm release:packages:verify

      - name: Audit production dependencies
        run: pnpm release:security

      - name: Scan tracked files for secrets
        run: pnpm release:secrets

      - name: Enforce legal release gate
        run: pnpm release:preflight

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release:publish
          version: pnpm release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  standalone-artifact:
    needs: release
    if: >-
      ${{ always() &&
      (needs.release.outputs.published == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.standalone_tag || github.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce standalone release gates
        run: >-
          pnpm release:preflight &&
          pnpm release:security &&
          pnpm release:secrets &&
          pnpm release:standalone:verify

      - name: Resolve standalone release
        id: standalone
        env:
          REQUESTED_TAG: ${{ inputs.standalone_tag }}
        run: |
          standalone_version="$(node -p "require('./apps/standalone/package.json').version")"
          standalone_tag="@entellix/standalone@${standalone_version}"
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$standalone_tag" ]; then
            echo "Requested tag $REQUESTED_TAG does not match package version tag $standalone_tag" >&2
            exit 1
          fi
          echo "tag=$standalone_tag" >> "$GITHUB_OUTPUT"
          echo "archive=artifacts/entellix-standalone-${standalone_version}.tgz" >> "$GITHUB_OUTPUT"
          echo "archive_name=entellix-standalone-${standalone_version}.tgz" >> "$GITHUB_OUTPUT"

      - name: Build standalone artifact
        run: pnpm release:standalone:artifact

      - name: Attest standalone artifact
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.standalone.outputs.archive }}

      - name: Upload standalone artifact
        env:
          GH_TOKEN: ${{ github.token }}
          STANDALONE_ARCHIVE: ${{ steps.standalone.outputs.archive }}
          STANDALONE_TAG: ${{ steps.standalone.outputs.tag }}
        run: gh release upload "$STANDALONE_TAG" "$STANDALONE_ARCHIVE" --clobber

      - name: Verify standalone release asset and attestation
        env:
          GH_TOKEN: ${{ github.token }}
          STANDALONE_ARCHIVE: ${{ steps.standalone.outputs.archive }}
          STANDALONE_ARCHIVE_NAME: ${{ steps.standalone.outputs.archive_name }}
          STANDALONE_TAG: ${{ steps.standalone.outputs.tag }}
        run: |
          asset_present="$(gh release view "$STANDALONE_TAG" --json assets --jq ".assets | any(.name == \"$STANDALONE_ARCHIVE_NAME\")")"
          if [ "$asset_present" != "true" ]; then
            echo "Release $STANDALONE_TAG is missing $STANDALONE_ARCHIVE_NAME" >&2
            exit 1
          fi
          gh attestation verify "$STANDALONE_ARCHIVE" --repo "$GITHUB_REPOSITORY"
