name: Public canary

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce legal release gate
        run: pnpm release:preflight

      - name: Audit production dependencies
        run: pnpm release:security

      - name: Scan tracked files for secrets
        run: pnpm release:secrets

      - name: Create snapshot versions
        run: pnpm changeset version --snapshot canary

      - name: Verify snapshot package artifacts
        run: pnpm release:packages:verify

      - name: Publish canary packages
        run: pnpm changeset publish --tag canary
