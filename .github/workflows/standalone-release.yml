name: Standalone release artifact

on:
  push:
    tags:
      - "@entellix/standalone@*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce release gates
        run: pnpm release:preflight && pnpm release:security && pnpm release:secrets

      - name: Build standalone artifact
        run: pnpm release:standalone:artifact

      - name: Attest standalone artifact
        uses: actions/attest@v4
        with:
          subject-path: artifacts/entellix-standalone-*.tgz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/entellix-standalone-*.tgz --generate-notes
